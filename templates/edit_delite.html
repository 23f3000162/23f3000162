<!DOCTYPE html>
<html>
<head>
  <title>Edit/Delete Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      background-color: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }

    .buttons button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn {
      background-color: #4CAF50;
      color: white;
    }

    .delete-btn {
      background-color: #f44336;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Edit or Delete Profile</h2>
    
    <form action="/update_profile" method="POST">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" value="John Doe" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" value="john@example.com" required>

      <div class="buttons">
        <button type="submit" class="save-btn">Save Changes</button>
        <button type="submit" class="delete-btn" formaction="/delete_profile" onclick="return confirm('Are you sure you want to delete your profile?');">Delete Profile</button>
      </div>
    </form>
  </div>

</body>
</html>
