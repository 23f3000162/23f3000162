<!DOCTYPE html>
<html>
<head>
  <title>Book Parking Spot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .booking-container {
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      width: 350px;
    }

    .booking-header {
      background-color: #f9e76e;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
    }

    .button-group {
      display: flex;
      justify-content: space-between;
    }

    .button-group button {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .reserve-btn {
      background-color: #4da6ff;
      color: white;
    }

    .cancel-btn {
      background-color: #b3d9ff;
    }
  </style>
</head>
<body>
   <form action="/book_the_parking_spot" method="post">
  <div class="booking-container">
    <div class="booking-header">Book the parking spot</div>

    <label>Spot_ID :</label>
    <input type="text" value="xxxxx" readonly name="spot_id">

    <label>Lot_ID :</label>
    <input type="text" value="xxxxx" readonly name="lot_id">

    <label>User ID :</label>
    <input type="text" value="xxxxx" readonly name="user_id">

    <label>Vehicle Number :</label>
    <input type="text" placeholder="Enter vehicle number" name="vehicle_number" required>

    <div class="button-group">
      <button class="reserve-btn" type="submit">Reserve</button>
      <button class="cancel-btn" href="/user_dashboard">Cancel</button>
    </div>
  </div>
</form>
</body>
</html>
