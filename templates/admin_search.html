<!DOCTYPE html>
<html>
<head>
  <title>Search Parking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .header {
      background-color: #ccffcc;
      padding: 10px;
      overflow: hidden; /* Yeh line add ki gayi hai float fix ke liye */
    }

    .header .welcome {
      color: red;
      font-weight: bold;
    }

    .header .menu {
      margin-left: 20px;
    }

    .header .edit-profile {
      float: right;
      color: blue;
    }

    .search-section {
      text-align: center;
      margin: 20px;
    }

    .search-section label {
      color: orange;
      font-weight: bold;
    }

    .search-section input {
      padding: 5px;
      margin-left: 10px;
      border-radius: 5px;
    }

    .hint-box {
      text-align: center;
      margin-top: 5px;
      font-style: italic;
    }

    .hint-box p {
      border: 1px dashed #aaa;
      display: inline-block;
      padding: 5px;
    }

    .search-title {
      text-align: center;
      border: 1px solid #3399ff;
      display: inline-block;
      padding: 5px 15px;
      border-radius: 10px;
      margin: 20px auto;
    }

    .parking-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }

    .parking-card {
      border: 2px solid #66b3ff;
      padding: 15px;
      border-radius: 10px;
      width: 150px;
      text-align: center;
    }

    .parking-card span {
      color: green;
    }

    .spots {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Header Bar -->
  <div class="header">
    <span class="welcome">Welcome to Admin</span>
    <span class="welcome-text">Welcome to Admin</span>
    <span class="menu">
      <a href="/admin_dashboard">Home</a> |
      <a href="/admin_users">Users</a> |
      <a href="/admin_search">Search</a> |
      <a href="/admin_summery">Summary</a> |
      <a href="/login">Logout</a>
    </span>
    <span class="edit-profile"><a href="/edit_delite">Edit Profile</a></span>
  </div>

</body>
</html>
