<!DOCTYPE html>
<html>
<head>
  <title>Release Parking Spot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      width: 350px;
    }

    .header {
      background-color: #f9e76e;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .button-group {
      display: flex;
      justify-content: space-between;
    }

    .button-group button {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .button-release {
      background-color: #4da6ff;
      color: white;
    }

    .button-cancel {
      background-color: #b3d9ff;
    }
  </style>
</head>
<body>
  <form action="/relase_the_parking_spot" method="POST">

  <div class="container">

    <div class="header">Release the parking spot</div>

    <label>Spot_ID :</label>
    <input type="text"  name="spot_id"> 

    <label>Vehicle Number :</label>
    <input type="text"  name="vehicle_number"> 

    <label>Parking time :</label>
    <input type="text"  name="parking_time" >

    <label>Releasing time :</label>
    <input type="text"  name="releasing_time" >

    <label>Total cost :</label>
    <input type="text"  name="total_cost">

    <div class="button-group">
      <button class="button-release" type="submit" >Release</button>
      <button class="button-cancel">Cancel</button>
    </div>

  </div>
</form>
</body>
</html>
