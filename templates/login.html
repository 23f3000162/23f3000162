<!DOCTYPE html>
<html>
<head>
  <title>User Login</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .login-container {
      border: 2px solid black;
      border-radius: 15px;
      padding: 30px;
      width: 300px;
    }

    .login-container h2 {
      text-align: center;
      color: purple;
      margin-top: 0;
    }

    form label {
      display: block;
      margin-bottom: 5px;
    }

    form input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
    }

    form button {
      width: 100%;
      padding: 10px;
      background-color: #6ec6ff;
      border: none;
      border-radius: 5px;
    }

    .login-container p {
      text-align: center;
      margin-top: 10px;
    }

    .login-container a {
      color: orange;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>User Login</h2>

    <form action="/login" method="POST">
      <label>Registered Email ID:</label>
      <input type="email" required name="username">

      <label>Password :</label>
      <input type="password" required name="password">

      <button type="submit">Login</button>
    </form>

    <p>
      <a href="/login_user">Create Account?</a>
    </p>
  </div>

</body>
</html>
