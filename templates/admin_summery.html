<!DOCTYPE html>
<html>
<head>
  <title>Summary - Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .header {
      background-color: #ccffcc;
      padding: 10px;
      overflow: hidden; /* float fix */
    }

    .header span {
      margin-right: 15px;
    }

    .header .welcome {
      color: red;
      font-weight: bold;
    }

    .header .menu {
      margin-left: 20px;
    }

    .header .edit-profile {
      float: right;
      color: blue;
    }

    .title {
      text-align: center;
      color: orange;
      margin-top: 20px;
      font-weight: bold;
    }

    .charts {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 40px;
    }

    .chart-box {
      border: 2px solid #ccc;
      border-radius: 20px;
      width: 200px;
      height: 200px;
      text-align: center;
      padding-top: 20px;
      box-shadow: 2px 2px 10px #ccc;
    }

    .donut {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: conic-gradient(#99ff99 0% 60%, #66ccff 60% 100%);
      margin: 0 auto;
      position: relative;
    }

    .donut::before {
      content: "";
      position: absolute;
      top: 20%;
      left: 20%;
      width: 40%;
      height: 40%;
      background-color: white;
      border-radius: 50%;
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 100px;
      margin: 0 auto;
      width: 120px;
      gap: 5px;
    }

    .bar {
      width: 20px;
      border-radius: 5px;
    }

    .occupied {
      height: 80px;
      background-color: #66ccff;
    }

    .available {
      height: 40px;
      background-color: #ff9999;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="welcome">Welcome to Admin</span>
    <span class="welcome-text">Welcome to Admin</span>
    <span class="menu">
      <a href="/admin_dashboard">Home</a> |
      <a href="/admin_users">Users</a> |
      <a href="/admin_search">Search</a> |
      <a href="/admin_summery">Summary</a> |
      <a href="/login">Logout</a>
    </span>
    <span class="edit-profile"><a href="/edit_delite">Edit Profile</a></span>
  </div>

  <!-- Title -->
  <div class="title">
    Summary shows <span style="color: orangered;">statistical charts</span>
  </div>

  <!-- Charts -->
  <div class="charts">
    <!-- Donut Chart Dummy -->
    <div class="chart-box">
      <p>Revenue from each parking lot</p>
      <div class="donut"></div>
    </div>

    <!-- Bar Chart Dummy -->
    <div class="chart-box">
      <p>Available and Occupied Spots</p>
      <div class="bar-chart">
        <div class="bar occupied"></div>
        <div class="bar available"></div>
        <div class="bar occupied" style="height: 60px;"></div>
        <div class="bar available" style="height: 30px;"></div>
      </div>
    </div>
  </div>

</body>
</html>
