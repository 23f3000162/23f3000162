<!DOCTYPE html>
<html>
<head>
  <title>Edit Parking Lot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .form-container {
      width: 400px;
      margin: 30px auto;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      background-color: #fff;
    }

    .form-header {
      background-color: #ffe48c;
      padding: 10px;
      border-radius: 10px 10px 0 0;
      text-align: center;
      font-weight: bold;
    }

    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    form input[type="text"],
    form textarea {
      width: 100%;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }

    .form-buttons {
      margin-top: 20px;
      text-align: center;
    }

    .form-buttons button {
      padding: 8px 20px;
      background-color: #66b3ff;
      border: none;
      border-radius: 5px;
      color: white;
      margin-right: 10px;
      cursor: pointer;
    }

    .form-buttons button:last-child {
      margin-right: 0;
    }
  </style>
</head>
<body>

  <div class="form-container">

    <div class="form-header">Edit Parking Lot</div>

    <form>

      <label>Prime Location Name :</label>
      <input type="text" value="xxxxx" />

      <label>Address :</label>
      <textarea rows="3">-----</textarea>

      <label>Pin Code :</label>
      <input type="text" value="400100" />

      <label>Price (per hour) :</label>
      <input type="text" value="20" />

      <label>Maximum spots :</label>
      <input type="text" value="15" />

      <div class="form-buttons">
        <button type="submit">Update</button>
        <button type="button" onclick="window.location.href = '/admin_dashboard';">Cancel</button>
      </div>

    </form>
  </div>

</body>
</html>
