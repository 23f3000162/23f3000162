<!DOCTYPE html>
<html>
<head>
  <title>Registered Users</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .header {
      background-color: #ccffcc;
      padding: 10px;
      overflow: auto;
    }

    .header strong {
      color: red;
    }

    .header span.menu {
      margin-left: 20px;
    }

    .header .edit-profile {
      float: right;
      color: blue;
    }

    .title {
      text-align: center;
      margin-top: 20px;
    }

    .title h3 {
      display: inline-block;
      border: 1px solid #000;
      padding: 5px 15px;
      border-radius: 10px;
    }

    .user-table-container {
      width: 80%;
      margin: 20px auto;
      border: 2px solid #66b3ff;
      border-radius: 10px;
      padding: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    th, td {
      padding: 8px;
    }

    tr:first-child {
      border-bottom: 1px solid #ccc;
    }

    .footer-note {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div class="header">
    <span><strong>Welcome to Admin</strong></span>
    <span class="welcome-text">Welcome to Admin</span>
    <span class="menu">
  <a href="/admin_dashboard">Home</a> |
  <a href="/admin_users">Users</a> |
  <a href="/admin_search">Search</a> |
  <a href="/admin_summery">Summary</a> |
  <a href="/login">Logout</a>
</span>
    <span class="edit-profile"><a href="/edit_delite">Edit Profile</a></span>
  </div>

  <!-- Title -->
  <div class="title">
    <h3>Registered Users</h3>
  </div>

  <!-- User Table -->
  <div class="user-table-container">
    <table>
      <tr>
        <th>ID</th>
        <th>| E_Mail</th>
        <th>| Full name</th>
        <th>| Address</th>
        <th>| Pin code</th>
      </tr>
      {% for user in users %}
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.fullname }}</td>
        <td>{{ user.address }}</td>
        <td>{{ user.pincode }}</td>
      </tr>
      {% endfor %}
     
    </table>
    <p class="footer-note">etc.., users....</p>
  </div>

</body>
</html>
