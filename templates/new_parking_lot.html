<!DOCTYPE html>
<html>
<head>
  <title>New Parking Lot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }

    .form-container {
      width: 400px;
      margin: 50px auto;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      background-color: #fff;
    }

    .form-header {
      background-color: #ffe48c;
      padding: 10px;
      border-radius: 10px 10px 0 0;
      text-align: center;
      font-weight: bold;
    }

    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    form input[type="text"],
    form textarea {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .form-buttons {
      margin-top: 20px;
      text-align: center;
    }

    .form-buttons button {
      padding: 8px 20px;
      background-color: #66b3ff;
      border: none;
      border-radius: 5px;
      color: white;
      margin-right: 10px;
      cursor: pointer;
    }

    .form-buttons button:last-child {
      margin-right: 0;
    }
  </style>
</head>
<body>

  <div class="form-container">

    <div class="form-header">New Parking Lot</div>

    <form method="post" action="/new_parking_lot">

      <label>Prime Location Name :</label>
      <input type="text" placeholder="Enter location" name="location"/>

      <label>Address :</label>
      <textarea rows="3" placeholder="Enter address" name="address"></textarea>

      <label>Pin Code :</label>
      <input type="text" placeholder="Enter pincode" name="pincode"/>

      <label>Price (per hour) :</label>
      <input type="text" placeholder="₹ per hour" name="price"/>

      
      <label>Number of spots available :</label>
      <input type="text" placeholder="Available spots" name="available_spots"/>

      <div class="form-buttons">
        <button type="submit">Add</button>
        <button type="button" onclick="window.location.href = '/admin_dashboard';">Cancel</button>
      </div>

    </form>
  </div>

</body>
</html>
